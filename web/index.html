<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><title>场景有据</title><link rel="stylesheet" href="/style.css?v=20261018-workspace-2"><link rel="stylesheet" href="/workspace.css?v=20261018-response-3"><link rel="stylesheet" href="/fonts/mingcha-ui.css?v=20261018-natural-1"><link rel="stylesheet" href="/intake.css?v=20261018-natural-1"><link rel="stylesheet" href="/motion.css?v=20261018-natural-1"><link rel="stylesheet" href="/interactions.css?v=20261018-tabs-1"></head>
<body>
<aside class="app-sidebar" aria-label="工作空间导航"><button id="sidebar-toggle" class="sidebar-brand" type="button" aria-label="展开导航" aria-expanded="false"><img src="/youju.svg" alt=""><span class="sidebar-wordmark">场景有据</span></button><nav aria-label="主导航"><button class="nav-item selected" data-nav="create" data-new-task type="button" aria-label="开始创作" title="开始创作"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 3l5 5-12 12-6 1 1-6L16 3zM14 5l5 5M14 21h7"/></svg><span class="nav-label">开始创作</span></button><button class="nav-item" data-nav="history" type="button" aria-label="本次记录" title="本次记录"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3h10l3 3v15H8zM3 7v14M12 10h5m-5 5h5"/></svg><span class="nav-label">本次记录</span></button><button class="nav-item" data-nav="catalog" type="button" aria-label="产品资料" title="产品资料"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 4h7l2 2 2-2h7v16h-7l-2 2-2-2H3zM12 6v16"/></svg><span class="nav-label">产品资料</span></button></nav><section id="recent-section" class="recent-section" hidden><h2>最近创作</h2><div id="recent-tasks"></div></section><button id="settings-open" class="nav-item sidebar-settings" type="button" aria-label="设置" title="设置"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 3 2 3 1 1 4 2 2-2 3-1 3-4 1-2 2-3-2-3-1-1-4-2-2 2-3 1-3 4-1z"/><circle cx="12" cy="12" r="3"/></svg><span class="nav-label">设置</span></button></aside>
<main class="product-main"><section id="create-panel"><header class="welcome-heading"><img class="welcome-character" src="/youju.svg" alt=""><div class="welcome-copy"><h1>你好，我是有据<span class="greeting-stop">。</span></h1><p>告诉我顾客的需要，一起准备这次沟通。</p></div></header>
<section class="brief" aria-label="内容需求"><form id="brief-form" novalidate>
<div class="field scene-field"><label for="scene" class="intake-label">说说顾客与这次想做的内容</label><textarea id="scene" name="scene" rows="3" maxlength="1500" required></textarea></div>


<section id="poster-brief" class="poster-brief" hidden aria-label="海报设计简报"><div class="poster-section-heading"><div><h2>海报设置</h2></div></div><div class="poster-brief-grid"><label>投放用途<select id="poster-purpose"><option value="门店新品展示">门店新品展示</option><option value="社群咨询引流">社群咨询引流</option><option value="门店活动促销">门店活动促销</option><option value="电子屏产品展示">电子屏产品展示</option></select></label><label>画布尺寸<select id="poster-size"><option value="portrait">竖版 3:4 · 1080 × 1440</option><option value="square">方形 1:1 · 1080 × 1080</option><option value="story">全屏 9:16 · 1080 × 1920</option><option value="landscape">横屏 16:9 · 1920 × 1080</option><option value="a4">A4 比例 · 1240 × 1754</option><option value="custom">自定义像素</option></select></label><label id="poster-width-label" hidden>宽度 px<input id="poster-width" type="number" min="320" max="4096" value="1080"></label><label id="poster-height-label" hidden>高度 px<input id="poster-height" type="number" min="320" max="4096" value="1440"></label><label>主标题（选填）<input id="poster-headline" maxlength="80"></label><label>风格偏好<input id="poster-style" maxlength="200"></label><label>背景方式<select id="poster-background"><option value="solid">矢量构图与字体排版 · 默认</option><option value="generate">按需生成辅助背景 · 可选</option></select></label><label>生图模型<select id="poster-image-model"><option value="">使用已配置模型</option></select></label></div><div class="poster-direction-label">选择视觉方向</div><div class="poster-directions" role="group" aria-label="海报视觉方向"><button type="button" data-direction="minimal" class="selected">理性编辑</button><button type="button" data-direction="editorial">字体海报</button><button type="button" data-direction="bold">几何宣言</button></div><p id="poster-model-note" class="field-note"></p></section><div id="brief-details" class="brief-details" hidden><div class="required-fields"><div class="field"><label for="product">产品</label><input id="product" name="product" list="products" autocomplete="off" maxlength="200"><datalist id="products"></datalist><p id="catalog-note" class="field-note" role="status"></p></div><div class="field"><label for="audience">顾客</label><input id="audience" name="audience" autocomplete="off" maxlength="200"></div></div><fieldset class="platform-field"><legend>发布到</legend><div class="platforms" role="group" aria-label="发布平台"><button type="button" data-platform="xiaohongshu" class="selected" aria-pressed="true">小红书</button><button type="button" data-platform="wechat" aria-pressed="false">公众号</button><button type="button" data-platform="moments" aria-pressed="false">朋友圈</button><button type="button" data-platform="poster" aria-pressed="false">海报</button></div></fieldset><details class="sample-menu"><summary>用一个场景试试</summary><div class="sample-options"><button data-sample="student" type="button">大学新生选电脑</button><button data-sample="business" type="button">商务差旅办公</button><button data-sample="creator" type="button">设计学生的创作工具</button></div></details><div class="optional-grid"><div class="field"><label for="stage">顾客所处阶段</label><select id="stage" name="stage"><option value="awareness">刚开始了解</option><option value="consideration" selected>正在比较选择</option><option value="decision">准备到店体验</option><option value="onboarding">已经购买</option></select></div><div class="field"><label for="goal">内容目标</label><select id="goal" name="goal"><option value="帮助判断是否适合，并引导核对应用兼容性">帮助顾客做选择</option><option value="解释一个具体功能及其使用条件">讲清一个产品亮点</option><option value="引导携带常用文件到店验证">邀请到店体验</option><option value="提供有依据的上手指导">帮助新用户上手</option></select></div></div><div class="optional-grid creative-controls"><div class="field"><label for="creative-connector">内容编排</label><select id="creative-connector"><option value="auto">自动匹配发布平台</option></select></div><div class="field"><label for="creative-style">叙事与视觉风格</label><select id="creative-style"><option value="auto">自动选择</option></select></div></div><p id="creative-connector-note" class="field-note">按平台组织标题、封面与逐页内容。</p><div class="field"><label for="requirements">表达或排版要求</label><textarea id="requirements" name="requirements" rows="2" maxlength="1500"></textarea></div></div>
<div class="form-bottom"><button id="context-toggle" type="button" class="disclosure-toggle" aria-expanded="false" aria-controls="brief-details">补充条件</button><div class="form-actions"><button type="submit" id="generate" class="primary">开始创作</button></div></div></form></section>
<section id="intake-panel" class="intake-panel" hidden aria-label="确认这次需求"><header class="intake-question"><p id="intake-query"></p><button id="intake-edit" type="button" class="text-button">修改问题</button></header><div class="clarification-heading"><img class="clarification-character" src="/youju.svg" alt=""><div><h1 id="intake-title">再确认一点，就可以开始。</h1><p id="intake-description"></p></div></div><form id="clarification-form" novalidate><div id="intake-questions"></div><div class="clarification-actions"><button id="intake-continue" class="primary" type="submit">继续</button></div></form><p id="intake-error" class="intake-error" role="alert" hidden></p></section><section id="poster-workspace" class="poster-workspace" hidden aria-label="海报设计画布"><header class="poster-editor-heading"><div><h2>编辑海报</h2><p id="poster-summary"></p></div><button id="poster-rebrief" class="secondary" type="button">修改需求</button></header><div class="poster-editor-toolbar"><span id="poster-save-status" role="status">选择图层开始编辑</span><div><button id="poster-undo" class="secondary" type="button" disabled>撤销</button><button id="poster-save" class="secondary" type="button">保存修改</button><button id="poster-download-png" class="primary" type="button">导出 PNG</button><button id="poster-download-svg" class="secondary" type="button">导出 SVG</button><button id="poster-download-json" class="secondary" type="button">导出源文档</button></div></div><div class="poster-editor-layout"><aside class="poster-layer-panel"><h3>图层</h3><div id="poster-layers"></div><div id="poster-properties" hidden><h3>图层属性</h3><label>文字<textarea id="layer-text" rows="3" maxlength="1500"></textarea></label><div class="layer-grid"><label>X<input id="layer-x" type="number"></label><label>Y<input id="layer-y" type="number"></label><label>字号<input id="layer-font" type="number" min="8" max="200"></label><label>颜色<input id="layer-color" type="color" value="#24261f"></label><label>字体<select id="layer-family"><option value="display">现代黑体</option><option value="sans">无衬线</option><option value="serif">衬线</option><option value="mono">等宽</option></select></label><label>字距<input id="layer-spacing" type="number" min="-6" max="30" step="0.5" value="0"></label><label>行距<input id="layer-leading" type="number" min="0.9" max="1.8" step="0.05" value="1.3"></label></div><button id="poster-apply-layer" class="secondary" type="button">应用到画布</button><p id="layer-lock-note" class="field-note"></p></div></aside><div class="poster-stage"><div class="poster-canvas-controls"><label>缩放 <select id="poster-zoom"><option value="fit">适应画布</option><option value="0.25">25%</option><option value="0.5">50%</option><option value="0.75">75%</option><option value="1">100%</option></select></label><span id="poster-dimensions"></span></div><div id="poster-artboard"><iframe id="poster-preview" title="海报设计预览" sandbox="allow-same-origin"></iframe></div></div></div><details class="poster-audit"><summary>素材来源与设计检查</summary><div id="poster-audit-content"></div></details></section><div id="empty" hidden></div>
<section class="output" aria-label="生成结果"><div id="task-error" class="error-banner" role="alert" hidden></div><div id="loading" class="loading" role="status" hidden><img class="loading-character" src="/youju.svg" alt=""><h1>正在生成内容</h1><p id="running-summary"></p><p id="elapsed">已用 0 秒</p></div>
<div id="result" hidden><header class="result-heading"><div><h1 id="document-heading">内容结果</h1><p id="result-summary"></p></div><button id="edit-brief" type="button" class="secondary">修改需求</button></header><div class="result-layout"><article class="result-paper"><div class="result-toolbar"><div class="tabs" aria-label="结果内容"><button type="button" class="selected" data-view="preview" aria-pressed="true">图文内容</button><button type="button" data-view="strategy" aria-pressed="false">创作思路</button><button type="button" data-view="creative" aria-pressed="false" hidden>创意分镜</button><button type="button" data-view="sales" aria-pressed="false" hidden>客户方案</button></div><button type="button" id="copy" class="secondary">复制全文</button></div><div class="result-meta"><p id="result-status"></p><button id="evidence-toggle" class="text-button" type="button" aria-expanded="false" aria-controls="evidence-panel">查看资料与检查（<span id="fact-count">0</span>）</button></div><p id="result-notice"></p><div id="view-preview" class="result-view"></div><div id="view-strategy" class="result-view" hidden></div><div id="view-creative" class="result-view" hidden></div><div id="view-sales" class="result-view" hidden></div><div class="output-footer"><button type="button" id="download-md" class="secondary">导出 Markdown</button><button type="button" id="download-html" class="secondary">导出网页</button></div></article>
<aside id="evidence-panel" class="evidence" aria-label="资料与检查"><div class="evidence-heading"><h2>资料与检查</h2><button id="evidence-close" type="button" class="text-button">关闭</button></div><div class="evidence-tabs"><button class="selected" data-evidence="facts" type="button" aria-pressed="true">产品资料</button><button data-evidence="audit" type="button" aria-pressed="false">检查记录（<span id="audit-count">0</span>）</button></div><div id="evidence-facts"></div><div id="evidence-audit" hidden></div><details class="run-details"><summary>运行详情</summary><p id="model-caption"></p><div id="view-trace"></div></details></aside></div></div></section></section>
<section id="history-panel" hidden><header class="history-heading"><h1>本次记录</h1><button type="button" data-new-task class="secondary">创建内容</button></header><div id="history-list"></div></section>
<section id="catalog-panel" class="catalog-panel" hidden><header class="catalog-heading"><h1>产品资料</h1><p>选择产品，带着它开始这次创作。</p></header><div class="catalog-controls"><label for="catalog-search">查找产品</label><input id="catalog-search" type="search" autocomplete="off"><p id="catalog-source"></p></div><div id="catalog-list"></div></section></main>
<dialog id="settings-dialog"><form id="settings-form"><div class="dialog-heading"><div><h2>设置</h2></div><button type="button" id="settings-close" class="close" aria-label="关闭">×</button></div><div id="settings-disabled" class="notice" hidden>当前不是本机设置会话。请在服务器环境变量配置凭证。</div><label for="source-mode">资料来源</label><select id="source-mode"><option value="local">本地知识库＋官方资料</option><option value="live">ima 共享知识库</option><option value="demo">独立演练</option></select><p id="mode-notice" class="field-note"></p><p id="connection" role="status"></p><div class="settings-grid"><div><label for="ima-client">ima Client ID</label><input id="ima-client" autocomplete="off"><label for="ima-kb">已知共享库 ID <span>可跳过库名搜索，选填</span></label><input id="ima-kb" type="password" autocomplete="off"><label for="ima-key">ima API Key</label><input id="ima-key" type="password" autocomplete="new-password"></div><div><label for="llm-base">模型 API 地址</label><input id="llm-base" type="url" value="https://api.deepseek.com"><label for="llm-model">模型名称</label><input id="llm-model" value="deepseek-flash"><label for="llm-key">模型 API Key</label><input id="llm-key" type="password" autocomplete="new-password"></div></div><fieldset class="image-settings"><legend>海报生图连接</legend><p class="field-note">仅在选择 AI 场景背景时调用。密钥只发送到当前工作台后端。</p><label for="image-base">OpenAI 兼容 API 地址</label><input id="image-base" type="url"><label for="image-model">模型名称</label><input id="image-model"><label for="image-key">生图 API Key</label><input id="image-key" type="password" autocomplete="new-password"></fieldset><div id="settings-message" role="status"></div><div class="dialog-actions"><button type="button" id="probe" class="secondary">检查 ima 连接</button><button type="submit" id="save-settings" class="primary">保存连接</button></div></form></dialog>
<div id="toast" role="status" hidden></div><script src="/app.js?v=20261018-response-4" defer></script><script src="/catalog.js?v=20261018-workspace-2" defer></script><script src="/workspace-state.js?v=20261018-workspace-2" defer></script><script src="/intake.js?v=20261018-natural-1" defer></script><script src="/mascot.js?v=20261018-natural-1" defer></script><script src="/interactions.js?v=20261018-tabs-1" defer></script></body></html>
