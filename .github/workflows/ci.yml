name: MateQuill checks

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: matequill-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: pip install -r requirements-dev.txt -c constraints-runtime.txt
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/setup_test_postgres.py
        env:
          MATEQUILL_TEST_ADMIN_URL: postgresql+psycopg://postgres:matequill-ci-only@127.0.0.1:5432/postgres
      - run: python -m pytest -q
        env:
          MATEQUILL_STORE_DB: /tmp/matequill-ci-stores.sqlite3

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web-next
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web-next/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
